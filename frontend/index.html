<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Arms</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      /* Webcam feed is hidden; the game draws its own picture-in-picture. */
      #webcam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <video id="webcam" playsinline muted></video>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
